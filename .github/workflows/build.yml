name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project and Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          
          mkdir -p app/src/main/java/com/example/htmlviewer
          mkdir -p app/src/main/res/layout

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HTMLViewer"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.htmlviewer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.htmlviewer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="HTML Viewer"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <Button
                  android:id="@+id/btnOpen"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:padding="20dp"
                  android:text="Открыть .HTML файл"
                  android:textSize="18sp" />

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone" />
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/htmlviewer/MainActivity.kt
          package com.example.htmlviewer

          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private lateinit var btnOpen: Button

              private val pickHtmlFile = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) {
                      openHtmlInFullScreen(uri)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.webView)
                  btnOpen = findViewById(R.id.btnOpen)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      domStorageEnabled = true
                  }
                  webView.webViewClient = WebViewClient()

                  btnOpen.setOnClickListener {
                      pickHtmlFile.launch("text/html")
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) {
                              webView.goBack()
                          } else if (webView.visibility == View.VISIBLE) {
                              webView.visibility = View.GONE
                              btnOpen.visibility = View.VISIBLE
                          } else {
                              finish()
                          }
                      }
                  })
              }

              private fun openHtmlInFullScreen(uri: Uri) {
                  btnOpen.visibility = View.GONE
                  webView.visibility = View.VISIBLE

                  val windowInsetsController = WindowCompat.getInsetsController(window, window.decorView)
                  windowInsetsController.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  windowInsetsController.hide(WindowInsetsCompat.Type.systemBars())

                  contentResolver.openInputStream(uri)?.use { inputStream ->
                      val htmlContent = inputStream.bufferedReader().use { it.readText() }
                      webView.loadDataWithBaseURL(null, htmlContent, "text/html", "UTF-8", null)
                  }
              }
          }
          EOF

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Viewer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
