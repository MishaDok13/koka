name: Build Koka APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Unzip and Build
        run: |
          unzip -o *.zip
          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            DIR=$(find . -maxdepth 2 -name "settings.gradle*" -printf '%h\n' | head -n 1)
            if [ -n "$DIR" ] && [ "$DIR" != "." ]; then
              shopt -s dotglob
              mv "$DIR"/* .
            fi
          fi
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ready-APK
          path: "**/build/outputs/apk/debug/*.apk"     - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ready-APK
          path: "**/build/outputs/apk/debug/*.apk"
